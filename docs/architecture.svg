<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .bg{fill:#faf7f3}.box{fill:#fff;stroke:#ded7cf;stroke-width:2}.agent{fill:#eef5ef;stroke:#759878;stroke-width:3}.policy{fill:#fff7df;stroke:#d7ad3d;stroke-width:2}.human{fill:#fff0eb;stroke:#ef5a31;stroke-width:2}.t{font:700 26px Arial;fill:#171b2c}.s{font:18px Arial;fill:#53627a}.line{stroke:#8190a4;stroke-width:3;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8190a4"/></marker>
  </defs>
  <rect class="bg" width="1400" height="820"/>
  <text class="t" x="70" y="65">Porchlight — Good Neighbor Agent Architecture</text>
  <text class="s" x="70" y="98">Strands chooses permitted actions; deterministic tools and human checkpoints enforce safety.</text>

  <rect class="box" x="70" y="180" rx="24" width="260" height="110"/><text class="t" x="105" y="225">Coordinator UI</text><text class="s" x="105" y="260">Needs attention + audit</text>
  <rect class="box" x="70" y="365" rx="24" width="260" height="110"/><text class="t" x="105" y="410">Volunteer UI</text><text class="s" x="105" y="445">Route + stop outcomes</text>
  <rect class="box" x="425" y="270" rx="24" width="250" height="120"/><text class="t" x="470" y="315">FastAPI</text><text class="s" x="470" y="350">Workflow events</text>
  <rect class="agent" x="765" y="225" rx="24" width="290" height="150"/><text class="t" x="815" y="270">Strands Agent</text><text class="s" x="815" y="305">Tool orchestration</text><text class="s" x="815" y="335">Bedrock · Nova 2 Lite</text>
  <rect class="box" x="1145" y="150" rx="24" width="200" height="210"/><text class="t" x="1183" y="195">Tools</text><text class="s" x="1170" y="232">Find backup</text><text class="s" x="1170" y="263">Contact backup</text><text class="s" x="1170" y="294">Assign route</text><text class="s" x="1170" y="325">Reconcile</text>
  <rect class="policy" x="775" y="505" rx="24" width="270" height="130"/><text class="t" x="815" y="550">Program Policy</text><text class="s" x="810" y="585">No-answer protocol</text><text class="s" x="810" y="615">Escalation rules</text>
  <rect class="human" x="1110" y="505" rx="24" width="250" height="130"/><text class="t" x="1150" y="550">Human Boundary</text><text class="s" x="1140" y="585">Protocol completion</text><text class="s" x="1140" y="615">Acknowledgement</text>
  <rect class="box" x="445" y="555" rx="24" width="230" height="120"/><text class="t" x="492" y="600">State + Audit</text><text class="s" x="485" y="635">Synthetic demo data</text>

