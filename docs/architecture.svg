<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 44px Arial,sans-serif;fill:#2c2824}.sub{font:400 23px Arial,sans-serif;fill:#6f665f}.box{fill:#fff;stroke:#e3d7cf;stroke-width:2}.orange{fill:#fff0ea;stroke:#e9653b}.sage{fill:#eaf1eb;stroke:#718f78}.blue{fill:#edf5f8;stroke:#557c91}.purple{fill:#f6effb;stroke:#8e66b7}.h{font:700 27px Arial,sans-serif;fill:#2c2824}.t{font:400 20px Arial,sans-serif;fill:#514841}.small{font:400 17px Arial,sans-serif;fill:#6f665f}.arrow{stroke:#9b9087;stroke-width:5;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#9b9087"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f8f4ef"/>
  <text x="70" y="80" class="title">Porchlight architecture</text>
  <text x="70" y="120" class="sub">AI stays behind the product. Policy-enforcing tools and human-approved protocols authorize operational change.</text>

  <rect x="70" y="180" width="330" height="135" rx="26" class="box"/><text x="105" y="230" class="h">Coordinator</text><text x="105" y="270" class="t">routes · attention · review</text>
  <rect x="475" y="180" width="330" height="135" rx="26" class="box"/><text x="510" y="230" class="h">Volunteer PWA</text><text x="510" y="270" class="t">route · care card · outcomes</text>
  <rect x="880" y="180" width="330" height="135" rx="26" class="box"/><text x="915" y="230" class="h">Administrator</text><text x="915" y="270" class="t">people · policy · evaluation</text>

  <path d="M235 315 L235 380 L640 380" class="arrow"/>
  <path d="M640 315 L640 380" class="arrow"/>
  <path d="M1045 315 L1045 380 L690 380" class="arrow"/>

  <rect x="420" y="390" width="440" height="140" rx="28" class="orange"/><text x="490" y="445" class="h">FastAPI product API</text><text x="480" y="485" class="t">routes · stops · issues · settings</text><text x="475" y="515" class="small">communications · timeline · audit · agent runs</text>

  <path d="M520 530 L360 620" class="arrow"/><path d="M640 530 L640 620" class="arrow"/><path d="M760 530 L930 620" class="arrow"/>

  <rect x="100" y="625" width="360" height="145" rx="28" class="sage"/><text x="175" y="680" class="h">SQLite state</text><text x="145" y="720" class="t">persistent operations + evaluation evidence</text><text x="160" y="752" class="small">replaceable with normalized encrypted DB</text>
  <rect x="500" y="625" width="280" height="145" rx="28" class="blue"/><text x="550" y="680" class="h">Policy layer</text><text x="535" y="720" class="t">human-approved protocols</text><text x="545" y="752" class="small">validation + authorization</text>
  <rect x="830" y="625" width="360" height="145" rx="28" class="purple"/><text x="900" y="680" class="h">Strands Agent</text><text x="870" y="720" class="t">bounded workflow orchestration</text><text x="875" y="752" class="small">coverage · exceptions · reconciliation</text>

  <path d="M460 695 L500 695" class="arrow"/><path d="M830 695 L780 695" class="arrow"/>

  <rect x="1260" y="190" width="270" height="580" rx="28" class="box"/>
  <text x="1310" y="240" class="h">Integration seams</text>
  <text x="1300" y="300" class="t">Messaging</text><text x="1300" y="330" class="small">SMS / WhatsApp / email</text>
  <text x="1300" y="395" class="t">Maps</text><text x="1300" y="425" class="small">navigation + future optimization</text>
  <text x="1300" y="490" class="t">Scenario Lab</text><text x="1300" y="520" class="small">deterministic QA starting states</text>
  <text x="1300" y="585" class="t">Model provider</text><text x="1300" y="615" class="small">Strands + Gemini today</text>
  <text x="1300" y="680" class="t">Offline field access</text><text x="1300" y="710" class="small">cached route view; writes require online</text>
  <path d="M1190 695 L1260 695" class="arrow"/>
</svg>
